<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MedAssist Lung Agent</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="topbar">
        <div>
          <h1>MedAssist Lung Agent</h1>
          <p>肺部 X 光辅助筛查与日常健康咨询</p>
          <div class="comfort-tags" aria-label="能力标签">
            <span>RAG 健康咨询</span>
            <span>胸片辅助筛查</span>
            <span>红旗症状提醒</span>
          </div>
        </div>
        <a class="docs-link" href="/docs">API Docs</a>
      </section>

      <section class="grid">
        <article class="panel">
          <div class="panel-head">
            <div>
              <h2>健康咨询</h2>
              <p>先检索知识库，再给出保守建议</p>
            </div>
            <span>RAG</span>
          </div>
          <textarea id="question" placeholder="例如：高烧多少度可以吃退烧药？吃完螃蟹能吃西瓜吗？"></textarea>
          <div class="actions">
            <button id="askBtn">咨询</button>
            <button id="clearChatBtn" class="secondary">清空</button>
          </div>
          <div id="chatResult" class="result empty">回答会显示在这里。</div>
          <div id="followUpCard" class="follow-up-card" hidden>
            <div class="follow-up-head">
              <div>
                <h3>补充信息</h3>
                <p>可选择填写，填完后我会结合补充信息重新分析。</p>
              </div>
              <span id="followUpCount">0 项</span>
            </div>
            <div id="followUpButtons" class="follow-up-buttons"></div>
            <div id="followUpInputs" class="follow-up-inputs"></div>
            <div class="actions">
              <button id="submitFollowUpBtn">确认补充信息</button>
              <button id="skipFollowUpBtn" class="secondary">暂不补充</button>
            </div>
          </div>
        </article>

        <article class="panel">
          <div class="panel-head">
            <div>
              <h2>胸片分析</h2>
              <p>上传清晰胸片，查看概率与热力图</p>
            </div>
            <span>CNN</span>
          </div>
          <label class="upload">
            <input id="xrayFile" type="file" accept="image/*" />
            <span>选择胸部 X 光图片</span>
          </label>
          <div class="actions">
            <button id="analyzeBtn">分析</button>
          </div>
          <div class="preview-wrap">
            <img id="preview" alt="" />
            <img id="heatmap" alt="" />
          </div>
          <div id="xrayResult" class="result empty">影像结果会显示在这里。</div>
        </article>
      </section>

      <p class="disclaimer">本系统仅用于学习、科研和辅助信息检索，不能替代医生诊断、处方或急救建议。</p>
    </main>

    <div id="emergencyModal" class="modal-backdrop" hidden role="dialog" aria-modal="true" aria-labelledby="emergencyTitle">
      <div class="emergency-modal">
        <h2 id="emergencyTitle">请优先处理紧急风险</h2>
        <p>你描述的情况可能需要立即线下评估。请尽快就医，必要时拨打急救电话。</p>
        <div class="emergency-phone">120</div>
        <div class="modal-actions">
          <a id="humanDoctorLink" class="doctor-link" href="/docs">联系人工医生</a>
          <button id="closeEmergencyBtn" class="secondary" type="button">我知道了</button>
        </div>
      </div>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
